  - id: c1c7
    name: 1c7 中文独立开发者名录
    adapter: onec7
    profile: project
    group: 中文名录
    lang: zh
    auth: none
    enabled: true
    limit: 30
    enrich: fulltext
    fulltext_budget: 15
    # 名录源是 GitHub README 的 `- [名称](链接)：简介` 列表 → 结构上就没有日期，
    # 不是「没抓到」。显式豁免，否则 17 条会永远挂在「取数缺陷」里，把真缺陷淹掉。
    # 2026-09-21 复核补一条：README 的**章节标题带收录日**（`### 2026 年 9 月 21 号添加`），
    # 但那是「进名录的日期」≠ 项目发布日 —— 语义不同就分字段存（`extra.listed_at`），
    # 不许塞进 published_at（时间轴掺进第二种语义，整条分组就不可信了）。
    meta_unavailable:
      published_at: 名录 README 只有 名称/链接/简介 三列；章节标题的「收录日」语义不同 → 存 extra.listed_at
    params:
      # 2026-10-01 换源：原 `raw.githubusercontent.com` 在本网络 **TCP 通、TLS 被重置**
      # （WinError 10054，三层探针 2/2 复现；同轮 `api.github.com` TLS 0.2s 正常）
      # → 属该主机的链路层 TLS 干扰，不是站点腐化。改走 jsDelivr CDN 镜像（实测 2.6s / 451666B / 内容一致）。
      # 备选（实测可用但更慢）：fastly.jsdelivr.net 43.8s、gcore.jsdelivr.net 9.4s。
      # 不可用（实测）：testingcf.jsdelivr.net（10054）、raw.githack.com（10060）。
      # 复活条件：raw.githubusercontent.com TLS 恢复正常后可换回（每轮由 kb_audit 探针复检）。
      # 2026-10-17 二次换源：**cdn.jsdelivr.net 亦被同一类 TLS 干扰**（TCP ok 0.71s / TLS handshake timeout，
      # HTTP 10054；三层探针 + 对照 api.github.com（TLSv1.3 200 / 0.31s）证明是主机级而非出口整体）。
      # 实测候选：gcore.jsdelivr.net 2.6s / 489519B **与 ghproxy.net 逐字节一致** → 采用 gcore；
      # ghproxy.net 3.7s 可用（备选）；fastly（10054）、testingcf（10054）、cdn.statically.io（10060）、
      # gitcdn.link（10060）、raw.gitmirror.com（DNS 失败）均不可用。
      readme: https://gcore.jsdelivr.net/gh/1c7/chinese-independent-developer@master/README.md
    status: ok
    last_verified: '2026-10-01'
    note: >-
      取数源是 GitHub README（`- [名称](链接)：简介` 列表）。2026-09-30 起 raw.githubusercontent.com
      被 TLS 重置（连续两轮采集/体检同报 WinError 10054），2026-10-01 改走 jsDelivr 镜像。
      代价：jsDelivr 对 `@master` 分支别名有缓存（最长约 12h）→ 新收录条目可能有半天延迟，
      对本渠道（名录、低频更新）可接受。**若要更稳可加主源+备用源的 fallback 链，但那需要改 adapter 代码**，
      按「改渠道只改 channels.yaml」暂不做，待用户确认。
      **2026-10-16 补记**：jsDelivr 镜像本身也出现**间歇性 TLS 重置**（好窗口 6/8、坏窗口 0/8；
      raw/gcore/fastly 三镜像同批全 0/8）→ 详见 `backends.jsdelivr_cdn`。
      当日采集 error（3 次，含单渠道复跑）、体检探针 ok → 判镜像可用性波动，**非渠道腐化，保持 enabled**；
      本渠道无时间窗口 ⇒ 本轮不补无数据丢失。


