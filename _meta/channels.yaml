# ---------------- 渠道级内容门（可用率，来源 tools/kb_content_audit.py） ----------------
# 门槛：≥80% keep ｜ 50-80% 加主题过滤或降 limit ｜ <50% 降权或停用（写进 disabled 段）
# 每次跑完内容审计更新本段；数字是「可用/条目」，取自 00-索引/内容审计-all.md。

content_gate:
  audited_at: '2026-10-22'
  overall: '2715/3055（89%）'
  rows:
    - {id: producthunt, ratio: '381/387', verdict: keep}
    - {id: betalist, ratio: '192/192', verdict: keep}
    - {id: devto, ratio: '16/19', verdict: keep,
       note: n=19 小样本；标题 require_any 曾把样本全过滤（0 条 = 杀渠道），已回退为「少量标题排除 + limit 降量」}
    - {id: bilibili, ratio: '62/66', verdict: keep,
       note: 94%。2026-10-10：曾出现采集端 0 videos（探针同轮 ok）→ 调查确认 B 站搜索 API 实测健康
       （code=0 / 20 results / play>3000 有货）→ 判为**瞬态 WBI 风控空返回**，非渠道腐化。B 站是**累计搜索型渠道、无时间窗口**，
       本轮不补也无数据丢失（同 c1c7 判据），保持 enabled。2026-10-16 正常（8 条 / new 3，丢弃 4/12=33%「无主题词」）}
    - {id: indiehackers, ratio: '150/154', verdict: keep}
    - {id: hn_show, ratio: '1474/1559', verdict: keep,
       note: 95%。大厂产品假阳性已修（Show HN 标题自述的条目不再因提到 Stripe/Google 被判「大厂产品」）；
       主要残余是视频帖无正文（结构性，记死信）与 Exa 截断 34。2026-10-22 采集 40 条全命中、丢弃 0}
    - {id: github_new, ratio: '61/82', verdict: keep,
       note: 74%。噪声是 awesome-*/directory/clone/wiki/journal 类资源清单（标题规则已排除，见 rule_drops）。
       2026-10-11：体检探针报 error（0 repos / 44.5s，gh search 网络层 GET 错误），单渠道复检 **ok（3 repos / 4.4s）**
       + 三层探针（api.github.com TCP 0.15s / TLS 0.27s 正常）→ 判**瞬态网络层错误**，非渠道腐化；同轮采集取到 13 条为铁证。
       2026-10-16 丢弃 14/28（50%，未过 70 线）：7 条标题（journal/awesome-*/clone/directory）+ 7 条无主题词，逐条核对无误杀。
       2026-10-17 体检再报 error（`gh search` 90.8s 超时，`github_gh` 后端复检 timeout>45s）→ 三层探针对照
       `api.github.com` **/search/repositories 实测 200（7.37s，慢但通）**，且**同轮采集取到 13 条 / 写盘 11** ⇒ 瞬态链路慢，保持 enabled。
       2026-10-22 丢弃 17/28 = **61%**（7 标题 journal/awesome-*/clone/directory + 10 无主题词 库与 demo），逐条核对无误杀；探针 ok 3 repos / 2.1s}
    - {id: v2ex, ratio: '94/132', verdict: keep,
       note: 71%。主要噪声是「NAS 必装 Docker 推荐」类资源帖；rules.yaml 已排招聘/求职/求助。
       2026-10-16 丢弃 10/25（40%）：7 条标题（招聘/求职为主）+ 3 条无主题词，无误杀。
       ⚠ 待评估：v2ex 自述发布帖（「做了/做了一个/做了个…」）被主题词门滤掉（如「做了一个 Durable Agent Harness
       支持持久化任务崩溃恢复与断点续跑」），独立案例累计 n=3（按 item_id 去重）已达评估线 —— 见运行日志待跟进，
       处置方案需先做「小样本模拟 + 看剩余条数」两步校验，不在本轮动规则。
       2026-10-22 丢弃 2/25（8%）：1 条提问帖（无主题词，正确）+ 1 条**疑误杀**——
       「[分享创造] 测了 20 多个导航站后做的 Builderoom」（`2425218c95f8ecdd`，n=1 独立案例），命中全局 `exclude_title`
       的 `导航站|目录站`。该规则本意排「名录/资源站内容」，不该排「我做了个导航站」这种**自述发布** →
       同类独立案例累计 **n=2**（另一例 `889eb28da2792b1d` 9-29 起 n=3 但同一 item），**未到 n≥3 不动规则**}
    - {id: exa_discovery, ratio: '19/25', verdict: keep,
       note: 76%，小样本（weekly_only，非周一不跑）。1 条「Respira Exhale」疑误杀 n=1，未到动手阈值}
    - {id: reddit, ratio: '260/431', verdict: limit_reduced,
       note: 60%（全库最低）。已把 limit 40→30 控量（标题过滤模拟到 88% 但丢 29 条可用帖，代价大于收益，不采纳）。
       窗口外移 settle_days=10 / window_days=14 后近两周语料抓不到（见渠道 note），审计口径与采集口径要一起看。
       2026-10-16：源站正常（探针 ok / 3 posts，19 条 / new 19）→ 维持 limit_reduced。
       2026-10-22：**后端 arctic-shift 时间窗查询整体 500** → 本轮 0 条（属后端故障非渠道腐化，保持 enabled，详见 `backends` 段）}
    - {id: c1c7, ratio: '5/7', verdict: keep,
       note: 2026-10-16 6/7（n=7 小样本，报可用率要连 n 一起报）。本轮采集 error（WinError 10054 / 1.8s）：
       体检探针同轮 ok（9 entries / 2.8s），镜像对照实验显示 `cdn.jsdelivr.net` **间歇可用（好窗口 6/8、坏窗口 0/8）**，
       且 `raw`/`gcore`/`fastly` 三个镜像同批 0/8 → 判**镜像可用性波动（链路层 TLS 重置）**，非渠道腐化。
       累积型名录无时间窗口 ⇒ 本轮不补无数据丢失。详见 `backends` 段。
       2026-10-17 5/7（71%，n=7）。本轮再遇 10054：三层探针 TCP ok 0.71s / **TLS handshake timeout**、
       对照 api.github.com TLS1.3 200/0.31s 正常 → 仍是 CDN 家族主机级干扰；**gcore.jsdelivr.net 实测 200/489519B/2.6s
       且与 ghproxy.net 逐字节一致**（10-16 时 gcore 还 0/8）→ 换 gcore 后单渠道复检 ok/9 entries，采集取到 7 条。
       ⇒ **该 CDN 是窗口轮转，每次坏窗口都要重新用探针挑镜像，不要以为换过一次就一劳永逸**。
       2026-10-22 采集再报 10054（体检探针 ok / 9 entries / 4.3s）→ 同一个「窗口轮转」现象，第 3 次复现；
       累积型名录无时间窗口 ⇒ 不补无数据丢失，不改配置（换镜像只解决当时那个窗口）}


# ---------------- 后端可用性订正（实测，会被 kb_audit 复检） ----------------
backends:
  - id: exa_web_fetch
    use: 通用网页正文后端（唯一可用）
    status: ok
    verified: '2026-09-28'
    evidence: mcporter exa.web_fetch_exa 返回 IH 产品页正文。**2026-09-24 复检补记：免费额度会被打满**——
      同一轮采集与回填里出现 `429 / 空返回（code=1）`，`kb_audit` 打印「exa web_fetch 空返回（后端不可用？）」。
      这不是后端挂了，是额度耗尽；表现是「本轮正文补全整批无效」，容易被误读成渠道取数坏了。
      **2026-09-28 复检**：同一现象再现（采集 `exa web_fetch 空返回（code=1）` 但直取后仍补 8/24；
      回填 exa 批次 1 仅 3/9，余 9 条落 `no_backend`）→ 确认是**额度**而非后端故障，处理方式是
      降 `--fulltext-budget` / 分批跑 / 等额度重置，**不要改渠道参数**。
    limit: 免费额度可耗尽；额度打满时应降 --fulltext-budget 或分批跑，不要改渠道参数
    revive: 额度重置后自动恢复（无需改配置）
  - id: jina_reader
    use: 通用网页正文（agent-reach 声明 web=ok）
    status: unusable
    verified: '2026-09-24'
    evidence: r.jina.ai 返回 Tunnel 502 / HTTP 000，与 doctor 的 web=ok 矛盾 → 台账记录 delta（连续多轮复现）
    revive: 复测能返回正文后恢复，可重新用于 enrich_generic
  - id: arctic_shift
    use: Reddit 取数
    status: ok
    verified: '2026-10-25'
    evidence: ① after/before 只接受 epoch 秒或纯日期，带时区 ISO 会 400；② score 装载延迟：近 3 天帖子分数未沉淀（近 3 天 max=1 vs 7-14 天前 max=42）→ 采集用 settle_days=3 窗口；③ sort 只接受 asc/desc。
      ④ **2026-10-10 源站故障**（已恢复）：体检探针与采集端同轮返回各 sub `522`（kb_audit 后端复检亦为 `unusable / 522`）。
      三层探针定案 = **源站侧故障，非本机网络**：TCP ok 0.51s / TLS ok 0.62s / HTTP **522**（Cloudflare「源站连接超时」，
      连续 4/4 复现，单次 ~20s）；同网络对照 `api.github.com` TCP+TLS 均正常。
      **处置**：reddit 保持 enabled、不写 disabled（后端宕机 ≠ 渠道腐化；「连续 2 轮 empty → 停用」规则不适用于此）。
      ⑤ **2026-10-11 恢复**：kb_audit 渠道探针 reddit `ok / 3 posts`、后端复检 `ok / 1 rows / 2.0s` → 源站已恢复，status 转 ok。
      ⑥ **2026-10-22 再次故障（时间窗查询整体 500，非渠道腐化、非本机网络）**：体检 reddit `empty`，消息各 sub 稳定同报
      `500: Internal Server Error`（非网络错误漂移）。三层探针 = **TCP ok 0.32s / TLS ok 0.68s（TLSv1.3）/ HTTP 500**
      （body `{"data":null,"error":"Internal server error"}`，0.8s 快速失败，非超时）；同网络对照 `api.github.com` TCP 0.15s / TLS 0.41s 正常。
      参数矩阵定位到**触发条件**：不带任何时间窗 → `SideProject` 200 / 3 rows 正常；**只要带 `after` 或 `before`（epoch 秒、`YYYY-MM-DD`
      两种格式都试过，含 `sort=asc`）→ 一律 500**；`since` / `created_after` / `start` 报 400 `Unknown query parameter`
      ⇒ 参数名没变、是**服务端时间索引查询路径挂了**。另：`buildinpublic` / `indiehackers` / `microsaas` / `SaaS` 连**不带窗口**也 500
      （分片级故障，仅 SideProject 分片可用）。备选 `api.pullpush.io` 实测 **429**（`This website does not provide free scraping
      resources for agents`）；`www.reddit.com` / `old.reddit.com` 直连 **10060 超时**（本网络老问题）。
      **处置**：reddit 保持 enabled、**不写 disabled**（后端宕机 ≠ 渠道腐化），本轮 reddit 语料为空属预期损耗，不加 `--channels` 重试
      （时窗路径全挂，重试必空）。
      ⑦ **2026-10-25 恢复**：kb_audit 渠道探针 reddit `ok / 3 posts / 25.8s`、后端复检 `ok / 1 rows / 6.6s` → 时间窗查询路径已修好，
      status 由 `unstable` 转 **ok**。**第二次正面证实「后端宕机保持 enabled」判据**（首次 10-11 的 522 → 10-11 恢复）。
      复现规律：arctic-shift 的故障窗口约 2-4 轮（10-10 522 / 10-22 500 / 10-25 ok），**故障期不重试、不停用、不改配置**是正确处置。
    revive: 源站恢复后由 kb_audit 后端复检自动转 ok（2026-10-11、2026-10-25 两次先例）；复活判据 = 带 after/before 的请求返回 200 且 rows>0。
      若连续 ≥2 轮仍 500，再评估换 Reddit 取数后端（pullpush 已 429 不可用，需另找）或临时降该渠道权重；换后端要改 adapter，须用户确认
  - id: ih_algolia
    use: IndieHackers 结构化产品库
    status: unusable
    verified: '2026-09-20'
    evidence: 公开 search-only key 403；改用 /products HTML 解析 + Exa 正文
  - id: raw.githubusercontent.com
    use: c1c7 名录 README 取数源（原）
    status: unusable
    verified: '2026-10-01'
    evidence: >-
      TCP 通（0.1s）但 **TLS 握手被重置**（WinError 10054，三层探针 2/2 复现）；
      同轮对照 `api.github.com`（可读 git 仓库、github_new 在用）TLS 0.2s 正常
      → 属该主机级 SNI/TLS 干扰，不是 GitHub 全域不可用，也不是 c1c7 渠道腐化。
      表现：kb_audit 与 kb_collect 同轮均报同一句 `10054`（连续两轮 09-30 / 10-01）。
      处置：c1c7 改走 jsDelivr 镜像（见 channels.yaml c1c7 的 params.readme），不改代码。
      **2026-10-16 复检：仍 0/8 可用**（8 次直取全部 `WinError 10054`）→ 维持 unusable。
    revive: TLS 复位后可直接换回主源（每轮由 kb_audit 复检；先把 c1c7 的 params.readme 换回并单渠道复跑确认）
  - id: jsdelivr_cdn
    use: c1c7 名录 README 取数源（现用镜像）
    status: unstable
    verified: '2026-10-17'
    evidence: >-
      **间歇可用**：同一小时内实测出现「好窗口」与「坏窗口」两种状态 ——
      好窗口 `cdn.jsdelivr.net` 6/8 成功（中位 0.87s）且 adapter 连调 6/6 ok（17 entries）；
      坏窗口 0/8（全部 `WinError 10054`，或 `<urlopen error _ssl.c:1015: The handshake operation timed out>`）。
      **同批镜像对照（2026-10-16，各 8 次）**：`raw.githubusercontent.com` 0/8、`gcore.jsdelivr.net` 0/8、
      `fastly.jsdelivr.net` 0/8（后两者 2026-10-01 时还可用 → 说明是**本网络对该 CDN 家族的间歇性 TLS 重置**，
      不是 jsDelivr 单点故障，也不是 c1c7 渠道腐化）。
      **错误消息在 `10054` 与 `handshake timeout` 之间漂移** = 链路层特征（稳定同一 HTTP 码才是渠道问题）。
      表现：kb_audit 探针 `ok / 9 entries / 2.8s`，而同轮 kb_collect 报 `10054 / 1.8s`（连续 3 次，含单渠道复跑）。
      **同源核实**：把 `kb_collect` 与新进程分别调用同一个 `ad_onec7`，两者在同一时刻**同时失败** → 排除了
      「采集进程状态差异」，确认是**时间窗口**问题（早期 6/6 成功与后期 0/6 失败各成一段）。
      **2026-10-17 复检（窗口轮转再证）**：`cdn.jsdelivr.net` TCP ok 0.71s 但 **TLS handshake timeout**、HTTP 10054；
      `raw.githubusercontent.com` TCP ok 0.10s + TLS 10054；对照 `api.github.com` **TLSv1.3 / 200 / 0.31s 正常**
      ⇒ 仍是该 CDN 家族的**主机级** TLS 干扰（非出口整体故障）。
      同批换 `gcore.jsdelivr.net` → **200 / 489519B / 2.6s，与 ghproxy.net 逐字节一致**（10-16 时 gcore 为 0/8）
      ⇒ 证实是**窗口轮转而非某一主机永久坏掉**：镜像选择每一轮都应由探针重新裁决，不要以为换过就一劳永逸。
      已把 `params.readme` 指向 gcore 并单渠道复检 `ok / 9 entries / 2.0s`（端到端通过）。
    limit: >-
      间歇性链路重置；c1c7 是**累积型名录（无时间窗口）** ⇒ 单个坏窗口不补也无数据丢失，
      下轮自动恢复即可，**不要因此停用渠道**。`http_get` 现为 `retries=1`（2 次尝试），
      好窗口下足够，坏窗口下无效。
    revive: >-
      每轮由 kb_audit 探针复检。若「坏窗口」占比继续升高（如连续 ≥2 轮采集均取不到），
      再评估**主源+备用源 fallback 链**（`params.readme` 只能持一个 URL，fallback 需改 adapter 代码 → **须用户确认**）；
      备选路径候选：GitHub API contents（`api.github.com` 本网络正常，但需 base64 解码 README）。

