# ---------------- 渠道级内容门（可用率，来源 tools/kb_content_audit.py） ----------------
# 门槛：≥80% keep ｜ 50-80% 加主题过滤或降 limit ｜ <50% 降权或停用（写进 disabled 段）
# 每次跑完内容审计更新本段；数字是「可用/条目」，取自 00-索引/内容审计-all.md。

content_gate:
  audited_at: '2026-09-20'
  overall: '612/710（86%）'
  rows:
    - {id: producthunt, ratio: '49/49', verdict: keep}
    - {id: betalist, ratio: '23/23', verdict: keep}
    - {id: hn_show, ratio: '364/400', verdict: keep,
       note: 大厂产品假阳性已修（Show HN 标题自述的条目不再因提到 Stripe/Google 被判「大厂产品」）}
    - {id: indiehackers, ratio: '23/23', verdict: keep}
    - {id: bilibili, ratio: '18/19', verdict: keep}
    - {id: exa_discovery, ratio: '8/9', verdict: keep}
    - {id: v2ex, ratio: '20/24', verdict: keep,
       note: 83%，主要噪声是「NAS 必装 Docker 推荐」类资源帖；rules.yaml 已排招聘/求职/求助}
    - {id: c1c7, ratio: '6/7', verdict: keep,
       note: 修复前 43%（人物名片被当项目语料判不可用）→ 修复口径后 86%；新增社区入口页排除规则}
    - {id: github_new, ratio: '40/57', verdict: filter_added,
       note: 存量重判后 70%（原 62%）；rules.yaml 新增 clone/tutorial/wiki/journal/directory 排除}
    - {id: reddit, ratio: '58/94', verdict: limit_reduced,
       note: 62% → limit 40→30；标题过滤模拟到 88% 但丢 29 条可用帖，代价大于收益}
    - {id: devto, ratio: '3/5', verdict: limit_reduced,
       note: n=5 小样本；标题 require_any 会把 5 条全过滤（0 条 = 杀渠道），已回退为「少量标题排除 + limit 15→8」}

