# ---------------- 渠道级内容门（可用率，来源 tools/kb_content_audit.py） ----------------
# 门槛：≥80% keep ｜ 50-80% 加主题过滤或降 limit ｜ <50% 降权或停用（写进 disabled 段）
# 每次跑完内容审计更新本段；数字是「可用/条目」，取自 00-索引/内容审计-all.md。

content_gate:
  audited_at: '2026-09-26'
  overall: '1828/2068（88%）'
  rows:
    - {id: producthunt, ratio: '155/156', verdict: keep}
    - {id: betalist, ratio: '96/96', verdict: keep}
    - {id: devto, ratio: '10/10', verdict: keep,
       note: n=10 小样本；标题 require_any 曾把样本全过滤（0 条 = 杀渠道），已回退为「少量标题排除 + limit 降量」}
    - {id: bilibili, ratio: '47/49', verdict: keep}
    - {id: indiehackers, ratio: '77/78', verdict: keep}
    - {id: hn_show, ratio: '1131/1200', verdict: keep,
       note: 94%。大厂产品假阳性已修（Show HN 标题自述的条目不再因提到 Stripe/Google 被判「大厂产品」）；
       主要残余是视频帖无正文（结构性，记死信）与 Exa 截断}
    - {id: github_new, ratio: '48/64', verdict: keep,
       note: 75%。噪声是 awesome-*/directory/clone/wiki/journal 类资源清单（标题规则已排除，见 rule_drops）}
    - {id: v2ex, ratio: '40/52', verdict: keep,
       note: 77%。主要噪声是「NAS 必装 Docker 推荐」类资源帖；rules.yaml 已排招聘/求职/求助}
    - {id: exa_discovery, ratio: '12/17', verdict: keep,
       note: 71%，小样本（weekly_only，非周一不跑）}
    - {id: reddit, ratio: '204/338', verdict: limit_reduced,
