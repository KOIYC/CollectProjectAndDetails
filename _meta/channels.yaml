# 渠道注册表 — 独立开发项目知识库（KB）单一事实源
#
# 改渠道 = 改本文件，不需要改代码：kb_collect.py 按 adapter 字段分派。
# 每次运行前由 skill 流程先跑 kb_audit.py 探活，再决定 enabled 增删。
# status 取值：ok / auth（缺登录态，可解锁）/ error / disabled
#
# 字段说明
#   id         渠道唯一 id（= 目录名 = note 前缀，保持 ASCII）
#   adapter    kb_collect.py 中的取数实现
#   group      分组（用于索引与报表聚合）
#   lang       zh / en / mix
#   auth       none（零配置）/ cli（需本地 CLI）/ browser（需浏览器登录态）
#   limit      单次运行每渠道取数上限（控量，目标总量 100-300）
#   enrich     二次取全文字段：fulltext | comments | readme | none
#   last_verified / status_note  由 kb_audit 与人工维护

version: 2
updated: '2026-09-24'
total_target: 300

channels:


  # ---------------- 海外 · 发布与社区（核心） ----------------
  - id: hn_show
    name: HN Show HN
    adapter: hn_show
    profile: discussion
    group: 海外发布
    lang: en
    auth: none
    enabled: true
    limit: 40
    enrich: comments
    enrich_extra: fulltext
    fulltext_budget: 60
    params:
      tags: show_hn
      min_points: 2
    status: ok
    last_verified: '2026-09-20'
    note: algolia API 列表 + /items/<id> 取全量评论树（全量，mega 帖截断 800 条并标 truncated）
    meta_unavailable:
      project_url: "标题/正文中的外链需二次抽取 → structural dependency"
    

  - id: reddit
    name: Reddit 独立开发版块
    adapter: reddit_arctic
    profile: discussion
    group: 海外社区
    lang: en
    auth: none
    enabled: true
    limit: 30
    enrich: comments
    enrich_extra: fulltext
    fulltext_budget: 80
    params:
      subs: [SideProject, indiehackers, microsaas, SaaS, EntrepreneurRideAlong, buildinpublic, selfhosted, indiedev]
      window_days: 14
      settle_days: 10
      min_score: 3
      sort: desc
    status: ok
    last_verified: '2026-09-24'
    note: arctic-shift 镜像（匿名可用）。① 本网络 www.reddit.com 直连 502；② after 只吃 epoch 秒/纯日期，带时区 ISO 会 400；③ **score 沉淀比原先记录的更慢**——2026-09-24 连探两次 empty，直连探针实测：窗口「0~14 天前」（每 sub 最新 100 条）max_score=**2**、score≥3 的 **0** 条；而「3~13 天前」88/700、「10~17 天前」96/700、「17~24 天前」111/800 都有分。→ 窗口外移到 settle_days=10 / window_days=14（取「10~24 天前」）。**每 sub 只回最新 limit//8 条**，所以窗口的「新端」必须老到分数已沉淀，否则整批被 min_score 滤空。
    meta_unavailable:
      project_url: "链接帖的 url 可能在 external_url → 需要规范检查"
    
    limit_note: >-
      2026-09-20 内容门：可用率 58/94（62%），落在 50-80% 区间 → 按 skill 采取「降量」而非加标题过滤。
      实测过标题级 require_any（发布词+经营词两套）：可用率能到 88%，但要丢掉 29/98 条
      **审计判为可用**的帖子（讨论型内容的价值主要在评论树，标题信息量不足）——
      代价大于收益，故只把 limit 40→30 控量，规则留待有更好的分类器再上。



